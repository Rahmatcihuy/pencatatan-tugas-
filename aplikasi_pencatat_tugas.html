<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aplikasi Pencatat Tugas</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: {
                            50: '#eff6ff',
                            100: '#dbeafe',
                            500: '#3b82f6',
                            600: '#2563eb',
                            700: '#1d4ed8',
                        }
                    }
                }
            }
        }
    </script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .task-done {
            text-decoration: line-through;
            opacity: 0.6;
        }
        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }
        .dark ::-webkit-scrollbar-thumb {
            background: #475569;
        }
    </style>
</head>
<body class="bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-100 min-h-screen transition-colors duration-200">

    <div class="max-w-4xl mx-auto px-4 py-8">
        <!-- Header -->
        <header class="flex justify-between items-center mb-8 pb-4 border-b border-slate-200 dark:border-slate-800">
            <div>
                <h1 class="text-3xl font-bold flex items-center gap-3 text-primary-600 dark:text-primary-500">
                    <i class="fa-solid fa-list-check"></i> Catatan Tugas
                </h1>
                <p class="text-sm text-slate-500 dark:text-slate-400 mt-1">Kelola tugas harian Anda dengan mudah dan terorganisir.</p>
            </div>
            <button id="themeToggle" class="p-2.5 rounded-xl bg-slate-200 dark:bg-slate-800 text-slate-700 dark:text-slate-200 hover:bg-slate-300 dark:hover:bg-slate-700 transition" title="Ubah Tema">
                <i class="fa-solid fa-moon dark:hidden text-lg"></i>
                <i class="fa-solid fa-sun hidden dark:block text-lg"></i>
            </button>
        </header>

        <!-- Stats Cards -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-8">
            <div class="bg-white dark:bg-slate-800 p-4 rounded-xl shadow-sm border border-slate-100 dark:border-slate-700/50 flex items-center justify-between">
                <div>
                    <p class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Total Tugas</p>
                    <h3 id="statTotal" class="text-2xl font-bold mt-1">0</h3>
                </div>
                <div class="p-3 bg-blue-50 dark:bg-blue-900/30 text-blue-600 dark:text-blue-400 rounded-lg">
                    <i class="fa-solid fa-tasks text-xl"></i>
                </div>
            </div>
            <div class="bg-white dark:bg-slate-800 p-4 rounded-xl shadow-sm border border-slate-100 dark:border-slate-700/50 flex items-center justify-between">
                <div>
                    <p class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Pending</p>
                    <h3 id="statPending" class="text-2xl font-bold mt-1 text-amber-600 dark:text-amber-400">0</h3>
                </div>
                <div class="p-3 bg-amber-50 dark:bg-amber-900/30 text-amber-600 dark:text-amber-400 rounded-lg">
                    <i class="fa-regular fa-clock text-xl"></i>
                </div>
            </div>
            <div class="bg-white dark:bg-slate-800 p-4 rounded-xl shadow-sm border border-slate-100 dark:border-slate-700/50 flex items-center justify-between">
                <div>
                    <p class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Selesai</p>
                    <h3 id="statCompleted" class="text-2xl font-bold mt-1 text-emerald-600 dark:text-emerald-400">0</h3>
                </div>
                <div class="p-3 bg-emerald-50 dark:bg-emerald-900/30 text-emerald-600 dark:text-emerald-400 rounded-lg">
                    <i class="fa-regular fa-circle-check text-xl"></i>
                </div>
            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            <!-- Form Tambah Tugas -->
            <div class="lg:col-span-1">
                <div class="bg-white dark:bg-slate-800 p-5 rounded-2xl shadow-sm border border-slate-100 dark:border-slate-700/50 sticky top-6">
                    <h2 class="text-lg font-bold mb-4 flex items-center gap-2">
                        <i class="fa-solid fa-plus-circle text-primary-600 dark:text-primary-500"></i> Tambah Tugas Baru
                    </h2>
                    <form id="taskForm" class="space-y-4">
                        <div>
                            <label class="block text-xs font-semibold text-slate-600 dark:text-slate-300 mb-1">Judul Tugas <span class="text-red-500">*</span></label>
                            <input type="text" id="taskTitle" required placeholder="Misal: Selesaikan laporan..." class="w-full px-3 py-2 text-sm rounded-lg border border-slate-300 dark:border-slate-600 dark:bg-slate-700 focus:outline-none focus:ring-2 focus:ring-primary-500 dark:text-white">
                        </div>

                        <div>
                            <label class="block text-xs font-semibold text-slate-600 dark:text-slate-300 mb-1">Deskripsi</label>
                            <textarea id="taskDesc" rows="3" placeholder="Rincian tugas (opsional)..." class="w-full px-3 py-2 text-sm rounded-lg border border-slate-300 dark:border-slate-600 dark:bg-slate-700 focus:outline-none focus:ring-2 focus:ring-primary-500 dark:text-white"></textarea>
                        </div>

                        <div class="grid grid-cols-2 gap-3">
                            <div>
                                <label class="block text-xs font-semibold text-slate-600 dark:text-slate-300 mb-1">Kategori</label>
                                <select id="taskCategory" class="w-full px-3 py-2 text-sm rounded-lg border border-slate-300 dark:border-slate-600 dark:bg-slate-700 focus:outline-none focus:ring-2 focus:ring-primary-500 dark:text-white">
                                    <option value="Kerja">💼 Kerja</option>
                                    <option value="Pribadi">👤 Pribadi</option>
                                    <option value="Belajar">📚 Belajar</option>
                                    <option value="Keuangan">💰 Keuangan</option>
                                    <option value="Lainnya">📌 Lainnya</option>
                                </select>
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-slate-600 dark:text-slate-300 mb-1">Prioritas</label>
                                <select id="taskPriority" class="w-full px-3 py-2 text-sm rounded-lg border border-slate-300 dark:border-slate-600 dark:bg-slate-700 focus:outline-none focus:ring-2 focus:ring-primary-500 dark:text-white">
                                    <option value="Rendah">🟢 Rendah</option>
                                    <option value="Sedang" selected>🟡 Sedang</option>
                                    <option value="Tinggi">🔴 Tinggi</option>
                                </select>
                            </div>
                        </div>

                        <div>
                            <label class="block text-xs font-semibold text-slate-600 dark:text-slate-300 mb-1">Tenggat Waktu</label>
                            <input type="date" id="taskDueDate" class="w-full px-3 py-2 text-sm rounded-lg border border-slate-300 dark:border-slate-600 dark:bg-slate-700 focus:outline-none focus:ring-2 focus:ring-primary-500 dark:text-white">
                        </div>

                        <button type="submit" class="w-full py-2.5 px-4 bg-primary-600 hover:bg-primary-700 text-white text-sm font-semibold rounded-lg shadow-md hover:shadow-lg transition duration-200 flex items-center justify-center gap-2">
                            <i class="fa-solid fa-plus"></i> Simpan Tugas
                        </button>
                    </form>
                </div>
            </div>

            <!-- Daftar & Filter Tugas -->
            <div class="lg:col-span-2 space-y-4">
                <!-- Toolbar Search & Filter -->
                <div class="bg-white dark:bg-slate-800 p-4 rounded-2xl shadow-sm border border-slate-100 dark:border-slate-700/50 flex flex-col sm:flex-row gap-3 items-center justify-between">
                    <div class="relative w-full sm:w-1/2">
                        <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-sm"></i>
                        <input type="text" id="searchInput" placeholder="Cari tugas..." class="w-full pl-9 pr-3 py-2 text-sm rounded-lg border border-slate-200 dark:border-slate-600 dark:bg-slate-700 focus:outline-none focus:ring-2 focus:ring-primary-500 dark:text-white">
                    </div>
                    
                    <div class="flex gap-2 w-full sm:w-auto overflow-x-auto">
                        <select id="filterStatus" class="px-3 py-2 text-xs rounded-lg border border-slate-200 dark:border-slate-600 dark:bg-slate-700 focus:outline-none focus:ring-2 focus:ring-primary-500 dark:text-white">
                            <option value="semua">Semua Status</option>
                            <option value="pending">Belum Selesai</option>
                            <option value="selesai">Selesai</option>
                        </select>

                        <select id="filterPriority" class="px-3 py-2 text-xs rounded-lg border border-slate-200 dark:border-slate-600 dark:bg-slate-700 focus:outline-none focus:ring-2 focus:ring-primary-500 dark:text-white">
                            <option value="semua">Semua Prioritas</option>
                            <option value="Tinggi">Tinggi</option>
                            <option value="Sedang">Sedang</option>
                            <option value="Rendah">Rendah</option>
                        </select>
                    </div>
                </div>

                <!-- Kontainer Daftar Tugas -->
                <div id="taskList" class="space-y-3">
                    <!-- Tugas akan ditampilkan di sini menggunakan JS -->
                </div>

                <!-- Pesan Kosong -->
                <div id="emptyState" class="hidden text-center py-12 bg-white dark:bg-slate-800 rounded-2xl border border-dashed border-slate-300 dark:border-slate-700">
                    <i class="fa-regular fa-clipboard text-4xl text-slate-300 dark:text-slate-600 mb-3"></i>
                    <p class="text-slate-500 dark:text-slate-400 text-sm">Belum ada tugas. Silahkan tambahkan tugas baru!</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Custom Dialog / Modal Notifikasi -->
    <div id="toast" class="fixed bottom-5 right-5 bg-slate-900 dark:bg-slate-100 text-white dark:text-slate-900 px-4 py-3 rounded-xl shadow-xl flex items-center gap-3 text-sm opacity-0 pointer-events-none transition-all duration-300 z-50">
        <i id="toastIcon" class="fa-solid fa-check-circle text-emerald-400 dark:text-emerald-600"></i>
        <span id="toastMessage">Pesan tidak ada</span>
    </div>

    <script>
        // Data State
        let tasks = JSON.parse(localStorage.getItem('my_tasks')) || [];
        
        // Element Ref
        const taskForm = document.getElementById('taskForm');
        const taskTitle = document.getElementById('taskTitle');
        const taskDesc = document.getElementById('taskDesc');
        const taskCategory = document.getElementById('taskCategory');
        const taskPriority = document.getElementById('taskPriority');
        const taskDueDate = document.getElementById('taskDueDate');
        
        const taskList = document.getElementById('taskList');
        const emptyState = document.getElementById('emptyState');
        
        const searchInput = document.getElementById('searchInput');
        const filterStatus = document.getElementById('filterStatus');
        const filterPriority = document.getElementById('filterPriority');
        
        const statTotal = document.getElementById('statTotal');
        const statPending = document.getElementById('statPending');
        const statCompleted = document.getElementById('statCompleted');
        const themeToggle = document.getElementById('themeToggle');

        // Init App
        document.addEventListener('DOMContentLoaded', () => {
            initTheme();
            renderTasks();
            updateStats();
        });

        // Theme Handling
        function initTheme() {
            if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                document.documentElement.classList.add('dark');
            } else {
                document.documentElement.classList.remove('dark');
            }
        }

        themeToggle.addEventListener('click', () => {
            if (document.documentElement.classList.contains('dark')) {
                document.documentElement.classList.remove('dark');
                localStorage.theme = 'light';
            } else {
                document.documentElement.classList.add('dark');
                localStorage.theme = 'dark';
            }
        });

        // Simpan Data ke LocalStorage
        function saveTasks() {
            localStorage.setItem('my_tasks', JSON.stringify(tasks));
            updateStats();
        }

        // Notification Toast
        function showToast(msg, isSuccess = true) {
            const toast = document.getElementById('toast');
            const toastMessage = document.getElementById('toastMessage');
            const toastIcon = document.getElementById('toastIcon');

            toastMessage.textContent = msg;
            toastIcon.className = isSuccess 
                ? "fa-solid fa-circle-check text-emerald-400 dark:text-emerald-600" 
                : "fa-solid fa-circle-xmark text-rose-400 dark:text-rose-600";

            toast.classList.remove('opacity-0', 'pointer-events-none');
            setTimeout(() => {
                toast.classList.add('opacity-0', 'pointer-events-none');
            }, 3000);
        }

        // Tambah Tugas
        taskForm.addEventListener('submit', (e) => {
            e.preventDefault();

            const newTask = {
                id: Date.now().toString(),
                title: taskTitle.value.trim(),
                desc: taskDesc.value.trim(),
                category: taskCategory.value,
                priority: taskPriority.value,
                dueDate: taskDueDate.value,
                completed: false,
                createdAt: new Date().toISOString()
            };

            tasks.unshift(newTask);
            saveTasks();
            renderTasks();

            // Reset Form
            taskForm.reset();
            showToast('Tugas berhasil ditambahkan!');
        });

        // Toggle Status Selesai
        function toggleTask(id) {
            tasks = tasks.map(task => {
                if (task.id === id) {
                    const updatedStatus = !task.completed;
                    showToast(updatedStatus ? 'Tugas diselesaikan!' : 'Tugas dikembalikan ke pending');
                    return { ...task, completed: updatedStatus };
                }
                return task;
            });
            saveTasks();
            renderTasks();
        }

        // Hapus Tugas
        function deleteTask(id) {
            tasks = tasks.filter(task => task.id !== id);
            saveTasks();
            renderTasks();
            showToast('Tugas berhasil dihapus', false);
        }

        // Update Statistik
        function updateStats() {
            const total = tasks.length;
            const completed = tasks.filter(t => t.completed).length;
            const pending = total - completed;

            statTotal.textContent = total;
            statPending.textContent = pending;
            statCompleted.textContent = completed;
        }

        // Badge Prioritas Helper
        function getPriorityBadge(priority) {
            switch (priority) {
                case 'Tinggi':
                    return `<span class="px-2 py-0.5 text-xs font-semibold rounded-full bg-red-100 text-red-700 dark:bg-red-900/40 dark:text-red-300">🔴 Tinggi</span>`;
                case 'Sedang':
                    return `<span class="px-2 py-0.5 text-xs font-semibold rounded-full bg-amber-100 text-amber-700 dark:bg-amber-900/40 dark:text-amber-300">🟡 Sedang</span>`;
                case 'Rendah':
                default:
                    return `<span class="px-2 py-0.5 text-xs font-semibold rounded-full bg-emerald-100 text-emerald-700 dark:bg-emerald-900/40 dark:text-emerald-300">🟢 Rendah</span>`;
            }
        }

        // Render Daftar Tugas
        function renderTasks() {
            const query = searchInput.value.toLowerCase();
            const statusFilter = filterStatus.value;
            const priorityFilter = filterPriority.value;

            // Filtering
            const filteredTasks = tasks.filter(task => {
                const matchesSearch = task.title.toLowerCase().includes(query) || task.desc.toLowerCase().includes(query);
                
                let matchesStatus = true;
                if (statusFilter === 'pending') matchesStatus = !task.completed;
                if (statusFilter === 'selesai') matchesStatus = task.completed;

                let matchesPriority = true;
                if (priorityFilter !== 'semua') matchesPriority = task.priority === priorityFilter;

                return matchesSearch && matchesStatus && matchesPriority;
            });

            taskList.innerHTML = '';

            if (filteredTasks.length === 0) {
                emptyState.classList.remove('hidden');
            } else {
                emptyState.classList.add('hidden');

                filteredTasks.forEach(task => {
                    const taskElement = document.createElement('div');
                    taskElement.className = `bg-white dark:bg-slate-800 p-4 rounded-xl shadow-sm border border-slate-100 dark:border-slate-700/50 flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4 transition duration-200 ${task.completed ? 'bg-slate-50/50 dark:bg-slate-800/40' : ''}`;

                    const formattedDate = task.dueDate 
                        ? new Date(task.dueDate).toLocaleDateString('id-ID', { day: 'numeric', month: 'short', year: 'numeric' })
                        : null;

                    taskElement.innerHTML = `
                        <div class="flex items-start gap-3 w-full sm:w-auto">
                            <button onclick="toggleTask('${task.id}')" class="mt-1 text-slate-400 hover:text-primary-600 dark:hover:text-primary-400 transition">
                                ${task.completed 
                                    ? '<i class="fa-solid fa-circle-check text-xl text-emerald-500"></i>' 
                                    : '<i class="fa-regular fa-circle text-xl"></i>'}
                            </button>
                            <div class="space-y-1">
                                <h3 class="font-semibold text-sm sm:text-base ${task.completed ? 'task-done text-slate-400 dark:text-slate-500' : ''}">
                                    ${escapeHtml(task.title)}
                                </h3>
                                ${task.desc ? `<p class="text-xs text-slate-500 dark:text-slate-400 line-clamp-2">${escapeHtml(task.desc)}</p>` : ''}
                                
                                <div class="flex flex-wrap items-center gap-2 pt-1">
                                    <span class="px-2 py-0.5 text-xs font-medium rounded-md bg-slate-100 dark:bg-slate-700 text-slate-600 dark:text-slate-300">
                                        ${task.category}
                                    </span>
                                    ${getPriorityBadge(task.priority)}
                                    ${formattedDate ? `
                                        <span class="text-xs text-slate-400 flex items-center gap-1">
                                            <i class="fa-regular fa-calendar"></i> ${formattedDate}
                                        </span>
                                    ` : ''}
                                </div>
                            </div>
                        </div>

                        <div class="flex items-center gap-2 self-end sm:self-center">
                            <button onclick="deleteTask('${task.id}')" class="p-2 text-slate-400 hover:text-rose-500 dark:hover:text-rose-400 rounded-lg hover:bg-rose-50 dark:hover:bg-rose-950/30 transition" title="Hapus Tugas">
                                <i class="fa-solid fa-trash-can"></i>
                            </button>
                        </div>
                    `;

                    taskList.appendChild(taskElement);
                });
            }
        }

        // Sanitasi input teks untuk mencegah XSS
        function escapeHtml(str) {
            return str.replace(/[&<>"']/g, function(m) {
                return {
                    '&': '&amp;',
                    '<': '&lt;',
                    '>': '&gt;',
                    '"': '&quot;',
                    "'": '&#039;'
                }[m];
            });
        }

        // Event Listeners untuk Filter dan Search
        searchInput.addEventListener('input', renderTasks);
        filterStatus.addEventListener('change', renderTasks);
        filterPriority.addEventListener('change', renderTasks);
    </script>
</body>
</html>
